{% extends "base.html" %}
{% block title %}{{ section.title }} · {{ config.title }}{% endblock title %}
{% block content %}
<h1>{{ section.title }}</h1>
<ul class="postlist">
  {% for page in section.pages %}
  <li>
    <a href="{{ page.permalink }}">{{ page.title }}</a>
    <span class="meta">{{ page.date | date(format="%-d %B %Y") }}</span>
  </li>
  {% endfor %}
</ul>
{% endblock content %}
