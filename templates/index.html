{% extends "base.html" %}
{% block content %}
{{ section.content | safe }}
{% set posts = get_section(path="posts/_index.md") %}
<h2>Posts</h2>
<ul class="postlist">
  {% for page in posts.pages %}
  <li>
    <a href="{{ page.permalink }}">{{ page.title }}</a>
    <span class="meta">{{ page.date | date(format="%-d %B %Y") }}</span>
  </li>
  {% endfor %}
</ul>
{% endblock content %}
