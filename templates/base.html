<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path="atom.xml") }}">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #666666;
      --accent: #0b5aa2;
      --code-bg: #f5f5f4;
      --rule: #e2e2e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --fg: #d8dade;
        --muted: #9a9da3;
        --accent: #7ab3e8;
        --code-bg: #1e2126;
        --rule: #2a2d33;
      }
    }
    * { box-sizing: border-box; }
    html { font-size: 17px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 1.5rem 1.2rem 4rem;
    }
    header.site {
      max-width: 42rem;
      margin: 0 auto;
      padding: 1.2rem 1.2rem 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header.site a { text-decoration: none; color: var(--fg); }
    header.site .name { font-weight: bold; }
    header.site nav a { color: var(--muted); margin-left: 1rem; }
    header.site nav a:hover { color: var(--accent); }
    h1, h2, h3 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.25;
    }
    h1 { font-size: 1.7rem; margin: 1.6rem 0 0.4rem; }
    h2 { font-size: 1.25rem; margin-top: 2.2rem; }
    a { color: var(--accent); }
    .meta { color: var(--muted); font-size: 0.85rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    pre {
      background: var(--code-bg);
      padding: 0.9rem 1rem;
      overflow-x: auto;
      border-radius: 4px;
      font-size: 0.82rem;
      line-height: 1.45;
    }
    code {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.86em;
      background: var(--code-bg);
      padding: 0.1em 0.3em;
      border-radius: 3px;
    }
    pre code { background: none; padding: 0; font-size: inherit; }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.88rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    th, td { border-bottom: 1px solid var(--rule); padding: 0.4rem 0.6rem; text-align: left; }
    th { border-bottom-width: 2px; }
    blockquote {
      margin: 1rem 0;
      padding-left: 1rem;
      border-left: 3px solid var(--rule);
      color: var(--muted);
    }
    hr { border: none; border-top: 1px solid var(--rule); margin: 2rem 0; }
    footer.site {
      max-width: 42rem;
      margin: 0 auto;
      padding: 0 1.2rem 2rem;
      color: var(--muted);
      font-size: 0.85rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    ul.postlist { list-style: none; padding: 0; }
    ul.postlist li { margin: 0.9rem 0; }
    ul.postlist .meta { display: block; }
  </style>
</head>
<body>
  <header class="site">
    <a class="name" href="{{ config.base_url }}">{{ config.title }}</a>
    <nav>
      <a href="{{ get_url(path="@/posts/_index.md") }}">posts</a>
      <a href="{{ config.extra.github }}">github</a>
      <a href="{{ config.extra.linkedin }}">linkedin</a>
      <a href="mailto:{{ config.extra.email }}">email</a>
      <a href="{{ get_url(path="atom.xml") }}">feed</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock content %}
  </main>
</body>
</html>
